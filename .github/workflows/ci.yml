name: CI - Unit Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-qmake \
            libqt6gui6 \
            libgl1-mesa-dev
      
      - name: Verify environment
        run: |
          echo "=== 环境检查 ==="
          echo "当前目录: $(pwd)"
          echo "文件列表:"
          ls -la
          echo ""
          echo "检查qmake:"
          which qmake6 || which qmake-qt6 || which qmake || echo "qmake未找到"
          echo ""
          echo "检查tests.pro:"
          if [ -f "tests.pro" ]; then
            cat tests.pro
          else
            echo "tests.pro不存在"
            exit 1
          fi
      
      - name: Build with debug info
        run: |
          echo "=== 开始构建 ==="
          
          # 创建干净的构建目录
          rm -rf build
          mkdir -p build
          cd build
          
          # 使用 qmake
          QMAKE_CMD=""
          if command -v qmake6 &> /dev/null; then
            QMAKE_CMD="qmake6"
          elif command -v qmake-qt6 &> /dev/null; then
            QMAKE_CMD="qmake-qt6"
          elif command -v qmake &> /dev/null; then
            QMAKE_CMD="qmake"
          else
            echo "错误: 找不到qmake命令"
            exit 1
          fi
          
          echo "使用: $QMAKE_CMD"
          $QMAKE_CMD --version
          
          # 生成Makefile，使用详细输出
          echo "生成Makefile..."
          $QMAKE_CMD CONFIG+=testcase CONFIG+=console ../tests.pro
          
          echo "Makefile内容预览:"
          head -50 Makefile
          
          # 构建，使用详细输出
          echo "开始构建..."
          make -j4 V=1
          
          echo "构建完成，当前目录内容:"
          ls -la
          
          echo "查找所有可执行文件:"
          find . -type f -executable 2>/dev/null || echo "无执行文件"
          
          echo "查找包含 'test' 的文件:"
          find . -type f -name "*test*" 2>/dev/null | head -10
      
      - name: Find and run test executable
        run: |
          echo "=== 查找并运行测试 ==="
          cd build
          
          # 尝试不同的可执行文件名
          TEST_EXEC=""
          for name in OnlineMallTests OnlineMallSystemTests test_main test_user test_product; do
            if [ -f "$name" ] && [ -x "$name" ]; then
              TEST_EXEC="$name"
              break
            fi
          done
          
          if [ -z "$TEST_EXEC" ]; then
            echo "错误: 未找到任何测试可执行文件"
            echo "当前目录内容:"
            ls -la
            echo "所有文件:"
            find . -type f
            exit 1
          fi
          
          echo "找到测试可执行文件: $TEST_EXEC"
          echo "运行测试..."
          ./"$TEST_EXEC"
      
      - name: Check for object files if no executable
        if: failure()
        run: |
          echo "=== 检查构建产物 ==="
          cd build
          echo "Object文件:"
          find . -name "*.o" | head -10
          echo "Makefile状态:"
          make -n || true
      
      - name: Direct compilation attempt
        if: failure()
        run: |
          echo "=== 尝试直接编译 ==="
          cd build
          
          # 获取编译参数
          echo "尝试获取编译参数..."
          make -n 2>&1 | head -20
          
          # 尝试直接编译
          echo "直接编译test_main.cpp..."
          g++ -std=c++17 -c -I.. -I/usr/include/x86_64-linux-gnu/qt6 \
              -I/usr/include/x86_64-linux-gnu/qt6/QtCore \
              -I/usr/include/x86_64-linux-gnu/qt6/QtTest \
              ../test_main.cpp -o test_main.o 2>&1 | head -20 || true