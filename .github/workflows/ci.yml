name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (Linux, Qt 6.7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and build dependencies
        run: |
          sudo apt-get update
          # Try to install Qt6 packages (may vary across runners); also install generic build tools
          sudo apt-get install -y build-essential g++ make libxcb-xinerama0 libfontconfig1 \
            qt6-base-dev qt6-base-dev-tools qt6-qmake || true
          # Ensure qmake or qmake6 is available
          if command -v qmake6 >/dev/null 2>&1; then
            echo "Using qmake6"
          elif command -v qmake >/dev/null 2>&1; then
            echo "Using qmake"
          else
            echo "qmake not found: attempting to install qtchooser and qt5-qmake"
            sudo apt-get install -y qtchooser qt5-qmake || true
          fi

      - name: Locate .pro file
        id: find-pro
        run: |
          PRO=$(ls *.pro 2>/dev/null | head -n1 || true)
          if [ -z "$PRO" ]; then
            echo "No .pro file found in repository"; exit 1
          fi
          echo "PRO_FILE=$PRO" >> $GITHUB_OUTPUT

      - name: Run qmake
        run: |
          PRO_FILE="${{ steps.find-pro.outputs.PRO_FILE }}"
          echo "Using project file: $PRO_FILE"
          if [ -z "$PRO_FILE" ]; then
            echo "PRO_FILE is empty"; exit 1
          fi

          # Detect available qmake implementation and run it. Prefer qmake6.
          if command -v qmake6 >/dev/null 2>&1; then
            QMAKE_CMD=qmake6
          elif command -v qmake >/dev/null 2>&1; then
            QMAKE_CMD=qmake
          elif command -v qtchooser >/dev/null 2>&1; then
            QMAKE_CMD="qtchooser -qt=6 -run-tool=qmake"
          else
            echo "No qmake/qmake6/qtchooser found in PATH"; exit 1
          fi

          echo "Running: $QMAKE_CMD $PRO_FILE"
          # Use eval to allow composite commands like qtchooser -qt=6 -run-tool=qmake
          eval "$QMAKE_CMD \"$PRO_FILE\""

      - name: Build
        run: |
          make -j$(nproc)

      - name: Build artifacts listing
        run: |
          echo "Listing project directory after build:"; ls -la

      - name: Smoke test (binary existence)
        run: |
          BIN=$(find . -maxdepth 3 -type f -perm -111 -print | head -n 1 || true)
          echo "First executable found: $BIN"
          if [ -z "$BIN" ]; then
            echo "No executable found after build - check qmake/make output"; exit 1
          fi