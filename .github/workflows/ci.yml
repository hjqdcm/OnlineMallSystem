# .github/workflows/qmake-ci.yml
name: Qt qmake CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Qt and tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qt6-base-dev \
          qt6-base-dev-tools \
          qt6-tools-dev \
          build-essential
        
        echo "安装的Qt版本:"
        qmake6 --version
    
    - name: Build with qmake
      run: |
        echo "使用qmake构建项目..."
        qmake6 -v
        qmake6
        make -j$(nproc)
        
        if [ -f "./OnlineMallSystem" ]; then
          echo "✅ 构建成功"
          file ./OnlineMallSystem
        else
          echo "⚠️  未找到可执行文件"
          ls -la
        fi
    
    - name: Run tests if exist
      run: |
        echo "查找并运行测试..."
        
        # 查找所有测试程序
        for test in test_*; do
          if [ -f "$test" ] && [ -x "$test" ]; then
            echo "运行测试: $test"
            ./"$test" || echo "测试 $test 执行完成"
          fi
        done