name: CI - Unit Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Qt6
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-dev-tools
      
      - name: Build tests
        run: |
          mkdir -p build && cd build
          qmake6 ../tests.pro || qmake-qt6 ../tests.pro || qmake ../tests.pro
          make -j4
      
      - name: Run tests
        run: |
          cd build
          if [ -f "OnlineMallTests" ]; then
            ./OnlineMallTests
          else
            echo "Test executable not found"
            ls -la
            exit 1
          fi