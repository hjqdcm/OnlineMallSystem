name: CI - Simple Unit Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qt6-base-dev \
          qt6-base-dev-tools \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          libgl1-mesa-dev

    - name: Build tests directly
      run: |
        # 直接编译测试文件
        echo "编译测试程序..."
        g++ -std=c++17 \
          -I/usr/include/qt6 \
          -I/usr/include/qt6/QtCore \
          -I/usr/include/qt6/QtTest \
          -fPIC \
          test_main.cpp \
          test_user.cpp \
          test_product.cpp \
          user.cpp \
          product.cpp \
          -lQt6Core -lQt6Test -lQt6Gui \
          -o OnlineMallTests \
          -Wall -Wextra
        
        echo "编译完成，运行测试..."
        ./OnlineMallTests

    - name: Run basic compilation check
      if: failure()
      run: |
        # 如果测试构建失败，至少检查代码是否能编译
        echo "检查代码编译..."
        g++ -std=c++17 -c user.cpp -o user.o
        g++ -std=c++17 -c product.cpp -o product.o
        echo "基本编译检查通过"