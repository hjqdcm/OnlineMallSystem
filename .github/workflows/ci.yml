name: Unit Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        qt-version: [5.15]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          qt5-default \
          qtbase5-dev \
          qttools5-dev-tools

    - name: Verify UnitTests.pro exists
      run: |
        if [ ! -f "UnitTests.pro" ]; then
          echo "错误: UnitTests.pro 文件不存在!"
          exit 1
        fi
        echo "✅ UnitTests.pro 文件存在"

    - name: Build tests
      run: |
        echo "开始构建单元测试..."
        
        # 创建构建目录
        mkdir -p build
        cd build
        
        # 使用qmake
        qmake ../UnitTests.pro
        make -j$(nproc)
        
        # 检查是否生成了可执行文件
        if [ -f "UnitTests" ]; then
          echo "✅ 构建成功!"
          ls -la UnitTests
        else
          echo "❌ 构建失败: UnitTests 可执行文件未生成"
          exit 1
        fi

    - name: Run tests
      run: |
        echo "开始运行单元测试..."
        cd build
        
        if [ -f "UnitTests" ]; then
          # 运行测试
          ./UnitTests
          echo "✅ 测试运行完成"
        else
          echo "❌ 找不到测试可执行文件"
          exit 1
        fi