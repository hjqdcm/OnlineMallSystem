name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (Linux, Qt 6.7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and build dependencies
        run: |
          sudo apt-get update
          # Install common build tools
          sudo apt-get install -y build-essential g++ make libxcb-xinerama0 libfontconfig1 || true

          # Attempt to install Qt6 packages (may not be available on all runners)
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-qmake || true

          # Also install Qt5 qmake as a broadly available fallback
          sudo apt-get install -y qtbase5-dev qt5-qmake qtchooser || true

      - name: QMake / Qt debug info
        run: |
          echo "Which qmake:"; which qmake || true
          echo "Which qmake6:"; which qmake6 || true
          echo "qmake -v:"; qmake -v || true
          echo "qmake6 -v:"; qmake6 -v || true
          echo "qtchooser -print-env:"; qtchooser -print-env || true

      - name: Locate .pro file
        id: find-pro
        run: |
          PRO=$(ls *.pro 2>/dev/null | head -n1 || true)
          if [ -z "$PRO" ]; then
            echo "No .pro file found in repository"; exit 1
          fi
          echo "PRO_FILE=$PRO" >> $GITHUB_OUTPUT

      - name: Run qmake
        run: |
          PRO_FILE="${{ steps.find-pro.outputs.PRO_FILE }}"
          echo "Using project file: $PRO_FILE"
          if [ -z "$PRO_FILE" ]; then
            echo "PRO_FILE is empty"; exit 1
          fi

          # Detect available qmake implementation and run it. Prefer qmake6.
          if command -v qmake6 >/dev/null 2>&1; then
            QMAKE_CMD=qmake6
          elif command -v qmake >/dev/null 2>&1; then
            QMAKE_CMD=qmake
          elif command -v qtchooser >/dev/null 2>&1; then
            QMAKE_CMD="qtchooser -qt=6 -run-tool=qmake"
          else
            echo "No qmake/qmake6/qtchooser found in PATH"; exit 1
          fi

          echo "Running: $QMAKE_CMD $PRO_FILE"
          # Use eval to allow composite commands like qtchooser -qt=6 -run-tool=qmake
          eval "$QMAKE_CMD \"$PRO_FILE\""

      - name: Build
        run: |
          make -j$(nproc)

      - name: Build artifacts listing
        run: |
          echo "Listing project directory after build:"; ls -la

      - name: Run unit tests (headless)
        run: |
          # The project builds a test runner binary named 'OnlineMallSystem'
          if [ -x ./OnlineMallSystem ]; then
            echo "Running unit tests using ./OnlineMallSystem (headless/offscreen)"
            export QT_QPA_PLATFORM=offscreen

            # Run tests, capture output to file and also try to produce junit xml
            ./OnlineMallSystem -o junitxml:test_results.xml > test_output.log 2>&1
            RET=$?

            echo "--- TEST OUTPUT (last 200 lines) ---"
            tail -n 200 test_output.log || true
            echo "--- END TEST OUTPUT ---"

            # Exit with the test runner exit code to fail CI on test failures
            if [ $RET -ne 0 ]; then
              echo "Unit tests failed with exit code $RET"
              exit $RET
            fi

            echo "Unit tests passed"
          else
            echo "Test runner ./OnlineMallSystem not found or not executable"; exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test_output.log
            test_results.xml

      - name: Smoke test (binary existence)
        run: |
          BIN=$(find . -maxdepth 3 -type f -perm -111 -print | head -n 1 || true)
          echo "First executable found: $BIN"
          if [ -z "$BIN" ]; then
            echo "No executable found after build - check qmake/make output"; exit 1
          fi