name: Unit Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        qt-version: [5.15, 6.2, 6.5]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Qt ${{ matrix.qt-version }}
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ matrix.qt-version }}
        cache: true
        cache-key: qt-${{ matrix.qt-version }}-ubuntu-latest

    - name: Install dependencies (Qt 5)
      run: |
        if [ "${{ matrix.qt-version }}" = "5.15" ]; then
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qtbase5-dev \
            qtbase5-dev-tools \
            libgl1-mesa-dev
        fi

    - name: Build unit tests
      run: |
        echo "Building unit tests with Qt ${{ matrix.qt-version }}..."
        
        # 创建构建目录
        mkdir -p build
        cd build
        
        # 选择正确的qmake命令
        if [ "${{ matrix.qt-version }}" = "5.15" ]; then
          QMAKE_CMD="qmake"
        elif [ "${{ matrix.qt-version }}" = "6.2" ]; then
          QMAKE_CMD="qmake6"
        else
          QMAKE_CMD="qmake6"
        fi
        
        # 运行qmake
        $QMAKE_CMD ../UnitTests.pro
        
        # 编译
        make -j$(nproc)
        
        # 验证构建
        if [ -f "UnitTests" ] || [ -f "debug/UnitTests" ] || [ -f "release/UnitTests" ]; then
          echo "✅ Unit tests built successfully!"
        else
          echo "❌ Build failed!"
          exit 1
        fi

    - name: Run unit tests
      run: |
        echo "Running unit tests with Qt ${{ matrix.qt-version }}..."
        cd build
        
        # 查找测试可执行文件
        if [ -f "UnitTests" ]; then
          TEST_EXEC="./UnitTests"
        elif [ -f "debug/UnitTests" ]; then
          TEST_EXEC="./debug/UnitTests"
        elif [ -f "release/UnitTests" ]; then
          TEST_EXEC="./release/UnitTests"
        else
          echo "❌ Test executable not found!"
          exit 1
        fi
        
        # 运行测试
        echo "Test command: $TEST_EXEC -v2"
        $TEST_EXEC -v2

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-qt-${{ matrix.qt-version }}
        path: |
          build/*.xml
          build/*.txt
        retention-days: 7

  quick-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup minimal Qt environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          qt5-default \
          qtbase5-dev \
          qttools5-dev-tools

    - name: Quick build test
      run: |
        echo "Running quick build test for PR..."
        
        # 只检查编译是否成功
        mkdir -p build-quick
        cd build-quick
        qmake ../UnitTests.pro
        make -j2
        
        echo "✅ Quick build test passed!"

  validate-project:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Validate project structure
      run: |
        echo "=== Validating project structure ==="
        
        # 检查必要的文件是否存在
        REQUIRED_FILES=(
          "UnitTests.pro"
          "user.h" "user.cpp"
          "product.h" "product.cpp"
          "test_user.h" "test_user.cpp"
          "test_product.h" "test_product.cpp"
          "test_main.cpp"
        )
        
        for file in "${REQUIRED_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file"
          else
            echo "❌ $file (missing)"
            exit 1
          fi
        done
        
        # 检查不包含的文件
        EXCLUDED_FILES=(
          "main.cpp"
          "mainwindow.cpp"
          "test_integration.cpp"
          "test.cpp"
        )
        
        echo ""
        echo "=== Checking for excluded files ==="
        for file in "${EXCLUDED_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "⚠️  $file (present but will be excluded)"
          fi
        done
        
        echo ""
        echo "✅ Project structure validation passed!"